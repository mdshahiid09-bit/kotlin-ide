name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build Debug and Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Keystore Secrets Availability
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Signing secrets are configured."
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "Signing secrets are not fully configured. Release signing will be skipped."
          fi

      - name: Decode Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - << 'EOF'
          import os, base64, sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          clean_b64 = "".join(raw.split())
          if not clean_b64:
              print("ERROR: KEYSTORE_BASE64 is empty after stripping whitespace")
              sys.exit(1)

          runner_temp = os.environ.get("RUNNER_TEMP", "/tmp")
          ks_dir = os.path.join(runner_temp, "keystore")
          os.makedirs(ks_dir, exist_ok=True)
          ks_file = os.path.join(ks_dir, "release.jks")

          try:
              data = base64.b64decode(clean_b64)
          except Exception as e:
              print(f"ERROR: Base64 decode failed: {e}")
              sys.exit(1)

          if len(data) == 0:
              print("ERROR: Decoded keystore data is 0 bytes")
              sys.exit(1)

          with open(ks_file, "wb") as f:
              f.write(data)

          os.chmod(ks_file, 0o600)
          print(f"Decoded keystore successfully: {len(data)} bytes written to {ks_file}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KEYSTORE_FILE={ks_file}\n")
          EOF

      - name: Verify and Diagnose Keystore Credentials
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - << 'EOF'
          import os, subprocess, sys

          ks_file = os.environ.get("KEYSTORE_FILE", "").strip()
          ks_pass = os.environ.get("KEYSTORE_PASSWORD", "").strip()
          k_alias = os.environ.get("KEY_ALIAS", "").strip()
          k_pass = os.environ.get("KEY_PASSWORD", "").strip()

          print(f"Target alias: '{k_alias}'")

          # 1. Test listing with store password
          p = subprocess.run(
              ["keytool", "-list", "-keystore", ks_file, "-storepass", ks_pass],
              capture_output=True, text=True
          )
          if p.returncode == 0:
              print("SUCCESS: Store password verified! Entries found:")
              aliases_found = []
              for line in p.stdout.splitlines():
                  if "PrivateKeyEntry" in line or "trustedCertEntry" in line or "," in line:
                      print(f"  -> {line.strip()}")
                      parts = line.split(",")
                      if parts:
                          aliases_found.append(parts[0].strip())
          else:
              print(f"FAILURE: Store password rejected: {p.stderr.strip()}")
              sys.exit(1)

          # Find exact alias match or case-insensitive match
          matched_alias = k_alias
          if k_alias not in aliases_found:
              for a in aliases_found:
                  if a.lower() == k_alias.lower():
                      print(f"NOTICE: Found case-insensitive alias match: '{a}'")
                      matched_alias = a
                      break

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RESOLVED_KEY_ALIAS={matched_alias}\n")

          # 2. Test reading key entry with key password
          passwords_to_test = [k_pass]
          if ks_pass != k_pass:
              passwords_to_test.append(ks_pass)

          key_valid = False
          for test_pw in passwords_to_test:
              p2 = subprocess.run(
                  ["keytool", "-certreq", "-keystore", ks_file, "-alias", matched_alias, "-storepass", ks_pass, "-keypass", test_pw],
                  capture_output=True, text=True
              )
              if p2.returncode == 0:
                  print("SUCCESS: Private key is accessible with tested password!")
                  key_valid = True
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"RESOLVED_KEY_PASSWORD={test_pw}\n")
                  break
              else:
                  print(f"Notice: key access failed with a tested password ({p2.stderr.strip()})")

          if not key_valid:
              print("WARNING: 'keytool -certreq' test failed, but proceeding to let AGP attempt signing.")
              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write(f"RESOLVED_KEY_PASSWORD={k_pass}\n")
          EOF

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug_log.txt

      - name: Build Signed Release APK
        id: build_release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_release_log.txt

      - name: Verify Release APK Signature
        if: env.HAS_KEYSTORE == 'true' && success()
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            echo "Verifying signature with apksigner..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "$RELEASE_APK"
            else
              echo "apksigner not found, skipping verification"
            fi
          else
            echo "No release APK found to verify."
          fi

      - name: Report Failure Diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_FILE=""
          if [ -f build_release_log.txt ]; then
            LOG_FILE="build_release_log.txt"
          elif [ -f build_debug_log.txt ]; then
            LOG_FILE="build_debug_log.txt"
          fi

          if [ -n "$LOG_FILE" ]; then
            if grep -q "^e: " "$LOG_FILE"; then
              grep -C 2 "^e: " "$LOG_FILE" | head -n 80 > log_summary.txt
            else
              tail -n 80 "$LOG_FILE" > log_summary.txt
            fi
          else
            echo "No build log found" > log_summary.txt
          fi
          gh issue create --title "Build Diagnostic #${{ github.run_number }}" --body "Automated build failure log:
          \`\`\`
          $(cat log_summary.txt)
          \`\`\`" || true

      - name: Clean Up Keystore
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_FILE }}" ] && [ -f "${{ env.KEYSTORE_FILE }}" ]; then
            shred -u "${{ env.KEYSTORE_FILE }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_FILE }}"
          fi
          if [ -d "${{ runner.temp }}/keystore" ]; then
            rm -rf "${{ runner.temp }}/keystore"
          fi
          echo "Temporary keystore files securely cleaned up."

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK Artifact
        if: success() && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" KotlinIDE-debug.apk
            ASSETS+=("KotlinIDE-debug.apk")
          fi

          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Signed Release APK at: $RELEASE_APK"
            cp "$RELEASE_APK" KotlinIDE-release.apk
            ASSETS+=("KotlinIDE-release.apk")
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          NOTES="### Kotlin IDE Build #${{ github.run_number }}
          - **Debug APK**: \`KotlinIDE-debug.apk\` (Development testing)
          $([ -n "$RELEASE_APK" ] && echo "- **Signed Release APK**: \`KotlinIDE-release.apk\` (Production signed with Keystore)")"

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --title "Kotlin IDE Release #${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
