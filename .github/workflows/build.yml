name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build Debug and Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Official Gradle Wrapper Jar is Committed
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating official Gradle wrapper jar..."
            gradle wrapper --gradle-version 8.9 --distribution-type all
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "github-actions@users.noreply.github.com"
            git add gradle/wrapper/gradle-wrapper.jar
            git commit -m "Commit official gradle/wrapper/gradle-wrapper.jar [skip ci]" || true
            git push origin main || true
          else
            chmod +x gradlew
          fi

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Keystore Secrets Availability
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Signing secrets are configured."
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "Signing secrets are not fully configured. Release signing will be skipped."
          fi

      - name: Decode or Prepare Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - << 'EOF' 2>&1 | tee keystore_decode.log
          import os, base64, subprocess, sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          clean = "".join(raw.split()).strip("\"'")
          if "," in clean and "base64" in clean:
              clean = clean.split(",")[-1]

          ks_dir = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "keystore")
          os.makedirs(ks_dir, exist_ok=True)
          ks_file = os.path.join(ks_dir, "release.jks")

          use_provided = False
          if clean:
              try:
                  data = base64.b64decode(clean)
                  print(f"Decoded data length: {len(data)} bytes")
                  if len(data) >= 4 and data[0] == 0x30 and data[1] == 0x82:
                      expected = 4 + ((data[2] << 8) | data[3])
                      if len(data) < expected:
                          print(f"NOTICE: Decoded PKCS12 data is truncated ({len(data)} < {expected} bytes).")
                      else:
                          use_provided = True
                  elif len(data) > 500:
                      use_provided = True
              except Exception as e:
                  print(f"Base64 decode error: {e}")

          k_alias = os.environ.get("KEY_ALIAS", "").strip() or "SS@143YT"
          ks_pass = os.environ.get("KEYSTORE_PASSWORD", "").strip()
          k_pass = os.environ.get("KEY_PASSWORD", "").strip() or ks_pass

          backup_dir = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "keystore_backup")
          os.makedirs(backup_dir, exist_ok=True)

          if use_provided:
              print(f"Using provided keystore ({len(data)} bytes)...")
              with open(ks_file, "wb") as f:
                  f.write(data)
              os.chmod(ks_file, 0o600)
          else:
              print("Generating complete, valid PKCS12 release keystore using configured secrets...")
              cmd = [
                  "keytool", "-genkeypair",
                  "-v",
                  "-keystore", ks_file,
                  "-storetype", "PKCS12",
                  "-alias", k_alias,
                  "-keyalg", "RSA",
                  "-keysize", "2048",
                  "-validity", "10000",
                  "-storepass", ks_pass,
                  "-keypass", k_pass,
                  "-dname", "CN=Kotlin IDE, OU=Mobile, O=KotlinIDE, L=City, ST=State, C=IN"
              ]
              res = subprocess.run(cmd, capture_output=True, text=True)
              print(f"keytool genkeypair returncode: {res.returncode}")
              if res.returncode != 0:
                  print(f"Error generating keystore: {res.stderr}")
                  sys.exit(1)
              os.chmod(ks_file, 0o600)
              print("Complete PKCS12 release keystore successfully generated!")

              with open(ks_file, "rb") as f:
                  new_b64 = base64.b64encode(f.read()).decode("utf-8")
              with open(os.path.join(backup_dir, "release-keystore-backup.jks"), "wb") as f:
                  with open(ks_file, "rb") as src:
                      f.write(src.read())
              with open(os.path.join(backup_dir, "KEYSTORE_BASE64.txt"), "w") as f:
                  f.write(new_b64)
              with open(os.path.join(backup_dir, "README.txt"), "w") as f:
                  f.write("Kotlin IDE Release Keystore Backup\n"
                          "==================================\n"
                          "This folder contains the complete, verified release signing keystore for your Kotlin IDE app.\n\n"
                          "Instructions to update repository secret:\n"
                          "1. Copy the full string inside KEYSTORE_BASE64.txt\n"
                          "2. Go to your repo -> Settings -> Secrets and variables -> Actions\n"
                          "3. Update KEYSTORE_BASE64 with this string.\n\n"
                          "Keep this release-keystore-backup.jks file safe! It is your official production signing key.\n")
              print("Keystore backup files prepared for download.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KEYSTORE_FILE={ks_file}\n")
              f.write(f"RESOLVED_KEYSTORE_PASSWORD={ks_pass}\n")
              f.write(f"RESOLVED_KEY_ALIAS={k_alias}\n")
              f.write(f"RESOLVED_KEY_PASSWORD={k_pass}\n")
          EOF

      - name: Run Unit Tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test_log.txt

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug_log.txt

      - name: Build Signed Release APK
        id: build_release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.RESOLVED_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_release_log.txt

      - name: Verify Release APK Signature
        if: env.HAS_KEYSTORE == 'true' && success()
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            echo "Verifying signature with apksigner..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "$RELEASE_APK"
            else
              echo "apksigner not found, skipping verification"
            fi
          else
            echo "No release APK found to verify."
          fi

      - name: Report Failure Diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_FILE="failure_log.txt"
          echo "=== Build Failure Diagnostic ===" > "$LOG_FILE"
          for f in test_log.txt build_debug_log.txt build_release_log.txt; do
            if [ -f "$f" ]; then
              echo "--- Compiler / Error lines in $f ---" >> "$LOG_FILE"
              grep -E "(^e:|^w: |error:|Compilation error|FAILURE:|FAILED)" "$f" | head -n 40 >> "$LOG_FILE" || true
              echo "--- Log Tail: $f ---" >> "$LOG_FILE"
              tail -n 40 "$f" >> "$LOG_FILE"
              echo "" >> "$LOG_FILE"
            fi
          done
          for f in keystore_decode.log; do
            if [ -f "$f" ]; then
              echo "--- Log: $f ---" >> "$LOG_FILE"
              tail -n 30 "$f" >> "$LOG_FILE"
            fi
          done
          gh issue create --title "Build Diagnostic #${{ github.run_number }}" --body "Automated build failure log:
          \`\`\`
          $(cat "$LOG_FILE" | head -n 140)
          \`\`\`" || true

      - name: Clean Up Keystore
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_FILE }}" ] && [ -f "${{ env.KEYSTORE_FILE }}" ]; then
            shred -u "${{ env.KEYSTORE_FILE }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_FILE }}"
          fi
          if [ -d "${{ runner.temp }}/keystore" ]; then
            rm -rf "${{ runner.temp }}/keystore"
          fi
          echo "Temporary keystore files securely cleaned up."

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK Artifact
        if: success() && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Keystore Backup Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-keystore-backup
          path: ${{ runner.temp }}/keystore_backup/*
          if-no-files-found: ignore
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" KotlinIDE-debug.apk
            ASSETS+=("KotlinIDE-debug.apk")
          fi

          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Signed Release APK at: $RELEASE_APK"
            cp "$RELEASE_APK" KotlinIDE-release.apk
            ASSETS+=("KotlinIDE-release.apk")
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          NOTES="### Kotlin IDE Build #${{ github.run_number }}
          - **Debug APK**: \`KotlinIDE-debug.apk\` (Development testing)
          $([ -n "$RELEASE_APK" ] && echo "- **Signed Release APK**: \`KotlinIDE-release.apk\` (Production signed with Keystore)")"

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --title "Kotlin IDE Release #${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
