name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Ensure Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        id: assemble
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build_log.txt

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          echo "Found APK at: $APK_PATH"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh release create "v1.0.0" "$APK_PATH" \
            --title "Kotlin IDE v1.0.0 Debug APK" \
            --notes "Automated GitHub Actions build of Kotlin IDE Android application. Direct download installable debug APK." \
            --clobber || gh release upload "v1.0.0" "$APK_PATH" --clobber || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture Failure Log
        if: failure()
        run: |
          echo "### Build Failure Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(e: |error:|Unresolved reference|Compilation error)" build_log.txt | head -n 40 >> $GITHUB_STEP_SUMMARY || cat build_log.txt | tail -n 40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
