name: Build Android Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        id: assemble
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Report Failure Diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f build_log.txt ]; then
            if grep -q "^e: " build_log.txt; then
              grep -C 2 "^e: " build_log.txt | head -n 80 > log_summary.txt
            else
              tail -n 80 build_log.txt > log_summary.txt
            fi
          else
            echo "No build_log.txt found" > log_summary.txt
          fi
          gh issue create --title "Build Diagnostic #${{ github.run_number }}" --body "Automated build failure log:
          \`\`\`
          $(cat log_summary.txt)
          \`\`\`" || true

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" KotlinIDE-debug.apk
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          gh release create "$RELEASE_TAG" KotlinIDE-debug.apk \
            --title "Kotlin IDE Release #${{ github.run_number }}" \
            --notes "Kotlin IDE Debug APK. Ready to install on Android phone." \
            --latest
