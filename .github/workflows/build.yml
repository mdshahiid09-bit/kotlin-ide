name: Build Android APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build Debug and Signed Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Official Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9 --distribution-type all
          chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Keystore Secrets Availability
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
            echo "Signing secrets are configured."
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "Signing secrets are not fully configured. Release signing will be skipped."
          fi

      - name: Decode and Verify Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          python3 - << 'EOF' 2>&1 | tee keystore_prep.log
          import os, base64, subprocess, sys

          print("--- Step 1: Base64 Decoding ---")
          raw = os.environ.get("KEYSTORE_BASE64", "")
          clean_b64 = "".join(raw.split())
          print(f"Raw b64 length: {len(raw)}, Clean b64 length: {len(clean_b64)}")

          runner_temp = os.environ.get("RUNNER_TEMP", "/tmp")
          ks_dir = os.path.join(runner_temp, "keystore")
          os.makedirs(ks_dir, exist_ok=True)
          ks_file = os.path.join(ks_dir, "release.jks")

          try:
              data = base64.b64decode(clean_b64)
              print(f"Decoded bytes length: {len(data)}")
              with open(ks_file, "wb") as f:
                  f.write(data)
              os.chmod(ks_file, 0o600)
          except Exception as e:
              print(f"ERROR in decoding: {e}")
              sys.exit(1)

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"KEYSTORE_FILE={ks_file}\n")

          print("\n--- Step 2: Inspect Keystore Entries with keytool ---")
          ks_pass = os.environ.get("KEYSTORE_PASSWORD", "").strip()
          k_alias = os.environ.get("KEY_ALIAS", "").strip()
          k_pass = os.environ.get("KEY_PASSWORD", "").strip()

          res = subprocess.run(
              ["keytool", "-list", "-v", "-keystore", ks_file, "-storepass", ks_pass],
              capture_output=True, text=True
          )
          print(f"keytool list return code: {res.returncode}")
          if res.stdout:
              print("=== keytool output summary ===")
              for line in res.stdout.splitlines():
                  if any(k in line for k in ["Keystore type:", "Keystore provider:", "Alias name:", "Entry type:", "Creation date:"]):
                      print(f"  {line.strip()}")
          if res.stderr:
              for line in res.stderr.splitlines():
                  if "Warning" in line:
                      print(f"  {line.strip()}")

          actual_aliases = []
          for line in res.stdout.splitlines():
              if line.strip().startswith("Alias name:"):
                  alias = line.split("Alias name:")[1].strip()
                  actual_aliases.append(alias)

          print(f"\nConfigured KEY_ALIAS: '{k_alias}'")
          print(f"Aliases discovered in keystore: {actual_aliases}")

          matched_alias = k_alias
          if actual_aliases:
              if k_alias in actual_aliases:
                  matched_alias = k_alias
                  print(f"Exact alias match found: '{matched_alias}'")
              else:
                  for a in actual_aliases:
                      if a.lower() == k_alias.lower():
                          matched_alias = a
                          print(f"Case-insensitive alias match found: '{matched_alias}'")
                          break
                  else:
                      matched_alias = actual_aliases[0]
                      print(f"Using first available alias: '{matched_alias}'")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RESOLVED_KEY_ALIAS={matched_alias}\n")

          print("\n--- Step 3: Test Key Password ---")
          passwords = [("KEY_PASSWORD", k_pass)]
          if ks_pass != k_pass:
              passwords.append(("KEYSTORE_PASSWORD", ks_pass))

          working_key_pass = k_pass
          for name, pw in passwords:
              t = subprocess.run(
                  ["keytool", "-certreq", "-keystore", ks_file, "-alias", matched_alias, "-storepass", ks_pass, "-keypass", pw],
                  capture_output=True, text=True
              )
              print(f"Testing {name}: returncode={t.returncode}")
              if t.returncode == 0:
                  print(f"SUCCESS: {name} unlocked private key!")
                  working_key_pass = pw
                  break
              else:
                  err_line = t.stderr.strip().splitlines()[-1] if t.stderr.strip() else "failed"
                  print(f"Notice for {name}: {err_line}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RESOLVED_KEY_PASSWORD={working_key_pass}\n")
          EOF

      - name: Build Debug APK
        id: build_debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_debug_log.txt

      - name: Build Signed Release APK
        id: build_release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.RESOLVED_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.RESOLVED_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_release_log.txt

      - name: Verify Release APK Signature
        if: env.HAS_KEYSTORE == 'true' && success()
        run: |
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            echo "Verifying signature with apksigner..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "$RELEASE_APK"
            else
              echo "apksigner not found, skipping verification"
            fi
          else
            echo "No release APK found to verify."
          fi

      - name: Report Failure Diagnostic
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_FILE="failure_log.txt"
          echo "=== Build Failure Diagnostic ===" > "$LOG_FILE"
          for f in keystore_prep.log build_release_log.txt build_debug_log.txt; do
            if [ -f "$f" ]; then
              echo "--- Log: $f ---" >> "$LOG_FILE"
              tail -n 60 "$f" >> "$LOG_FILE"
              echo "" >> "$LOG_FILE"
            fi
          done
          gh issue create --title "Build Diagnostic #${{ github.run_number }}" --body "Automated build failure log:
          \`\`\`
          $(cat "$LOG_FILE" | head -n 120)
          \`\`\`" || true

      - name: Clean Up Keystore
        if: always()
        run: |
          if [ -n "${{ env.KEYSTORE_FILE }}" ] && [ -f "${{ env.KEYSTORE_FILE }}" ]; then
            shred -u "${{ env.KEYSTORE_FILE }}" 2>/dev/null || rm -f "${{ env.KEYSTORE_FILE }}"
          fi
          if [ -d "${{ runner.temp }}/keystore" ]; then
            rm -rf "${{ runner.temp }}/keystore"
          fi
          echo "Temporary keystore files securely cleaned up."

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Signed Release APK Artifact
        if: success() && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-ide-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=()
          DEBUG_APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at: $DEBUG_APK"
            cp "$DEBUG_APK" KotlinIDE-debug.apk
            ASSETS+=("KotlinIDE-debug.apk")
          fi

          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Signed Release APK at: $RELEASE_APK"
            cp "$RELEASE_APK" KotlinIDE-release.apk
            ASSETS+=("KotlinIDE-release.apk")
          fi

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}"
          NOTES="### Kotlin IDE Build #${{ github.run_number }}
          - **Debug APK**: \`KotlinIDE-debug.apk\` (Development testing)
          $([ -n "$RELEASE_APK" ] && echo "- **Signed Release APK**: \`KotlinIDE-release.apk\` (Production signed with Keystore)")"

          gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
            --title "Kotlin IDE Release #${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
